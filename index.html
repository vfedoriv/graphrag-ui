<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const storageKey = 'graphrag.appearance'
        let preference = 'system'
        try {
          const storedPreference = localStorage.getItem(storageKey)
          if (storedPreference === 'light' || storedPreference === 'dark' || storedPreference === 'system') {
            preference = storedPreference
          }
        } catch {
          // Use the system preference when browser storage is unavailable.
        }
        let systemPrefersDark = false
        try {
          systemPrefersDark = matchMedia('(prefers-color-scheme: dark)').matches
        } catch {
          // Light is the safe fallback when media queries are unavailable.
        }
        const theme = preference === 'system' ? (systemPrefersDark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>graphrag-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
